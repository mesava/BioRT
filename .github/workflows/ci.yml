name: BioRT CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore application
        run: dotnet restore BioRT.sln

      - name: Restore tests
        run: dotnet restore BioRT.Tests/BioRT.Tests.csproj

      - name: Build application
        run: dotnet build BioRT.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test BioRT.Tests/BioRT.Tests.csproj --configuration Release --no-restore --verbosity normal
